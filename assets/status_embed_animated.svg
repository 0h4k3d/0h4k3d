  <g transform="translate(560,165)">
    <g transform="scale(0.72) translate(3,-1)" opacity="0.9">
      <path fill="#9A9A9A" d="M18.9 0h4.68l-10.23 11.7L24.6 24h-8.6l-6.73-8.8L1.53 24H-3.15l10.95-12.52L-3.6 0h8.82l6.08 8.04L18.9 0z"></path>
