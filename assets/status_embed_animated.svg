  <text x="180" y="135" class="mono body decrypt-temp" style="animation-delay:0.30s" fill="#8a1f1f" opacity="0">@~&lt;}$-#})|]+[&amp;\#@</text>
  <text x="180" y="135" class="mono body decrypt-temp" style="animation-delay:0.39s" fill="#8a1f1f" opacity="0">/*0)#*$-(&lt;|+^++&amp;/</text>
