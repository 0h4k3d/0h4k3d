<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B3B"></stop>
      <stop offset="45%" stop-color="#B30000"></stop>
      <stop offset="100%" stop-color="#3A0000"></stop>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111214"></stop>
      <stop offset="55%" stop-color="#0A0A0B"></stop>
      <stop offset="100%" stop-color="#040404"></stop>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a0000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#1a0000" stop-opacity="0.55"></stop>
    </radialGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161618"></stop>
      <stop offset="100%" stop-color="#0D0D0E"></stop>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#FF2A2A" stroke-width="0.5" opacity="0.05"></path>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"></feDropShadow>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', Courier, monospace; }
      .title { font-size: 21px; font-weight: 700; letter-spacing: 0.5px; }
      .label { font-size: 11px; letter-spacing: 2px; font-weight: 600; }
      .body  { font-size: 13.5px; letter-spacing: 0.3px; }
      .footer { font-size: 10.5px; letter-spacing: 1px; }

      @keyframes flashTemp {
        0%   { opacity: 0; }
        18%  { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }
      .decrypt-temp {
        opacity: 0;
        animation-name: flashTemp;
        animation-duration: 0.22s;
        animation-timing-function: steps(1);
        animation-fill-mode: forwards;
      }

      @keyframes flashFinal {
        0%   { opacity: 0; }
        25%  { opacity: 1; }
        100% { opacity: 1; }
      }
      .decrypt-final {
        opacity: 0;
        animation-name: flashFinal;
        animation-duration: 0.3s;
        animation-timing-function: steps(1);
        animation-fill-mode: forwards;
      }

      /* Cycle des @ réseaux sociaux */
      @keyframes cycleHandle {
        0%, 8%   { opacity: 0; transform: translateY(4px); }
        14%, 42% { opacity: 1; transform: translateY(0); }
        50%, 100%{ opacity: 0; transform: translateY(-3px); }
      }
      .handle-cycle {
        opacity: 0;
        animation: cycleHandle 6s ease-in-out infinite;
      }
      .handle-1 { animation-delay: 1.3s; }
      .handle-2 { animation-delay: 4.3s; }
    </style>
  </defs>

  
  <rect x="4" y="6" width="712" height="252" rx="14" fill="#000000" opacity="0.001" filter="url(#cardShadow)"></rect>

  
  <rect x="1" y="1" width="718" height="258" rx="14" fill="url(#bgGrad)"></rect>
  <rect x="1" y="1" width="718" height="258" rx="14" fill="url(#grid)"></rect>
  <rect x="1" y="1" width="718" height="258" rx="14" fill="url(#vignette)"></rect>

  
  <rect x="1.5" y="1.5" width="717" height="257" rx="13.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.6" filter="url(#glowSoft)"></rect>

  
  <path d="M1 15 A14 14 0 0 1 15 1 L705 1 A14 14 0 0 1 719 15 L719 33 L1 33 Z" fill="url(#headerGrad)"></path>
  <circle cx="24" cy="17" r="5.5" fill="#ff5f57"></circle>
  <circle cx="43" cy="17" r="5.5" fill="#febc2e"></circle>
  <circle cx="62" cy="17" r="5.5" fill="#28c840"></circle>
  <text x="690" y="21" text-anchor="end" class="mono footer" fill="#4A4A4A" letter-spacing="2">TERMINAL</text>
  <line x1="1" y1="33" x2="719" y2="33" stroke="#2A0A0A" stroke-width="1"></line>

  
