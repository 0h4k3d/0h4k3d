  <text x="32" y="92" class="mono title decrypt-temp" style="animation-delay:0.23s" fill="#8a1f1f" opacity="0">\|\}=*&lt;[(1!01</text>
  <text x="32" y="92" class="mono title decrypt-final" style="animation-delay:0.32s" fill="#FF3B3B" filter="url(#glow)" opacity="0">h4k3d@root:~$ cat socialnetwork.txt</text>
  <line x1="32" y1="105" x2="490" y2="105" stroke="#2A0A0A" stroke-width="1"></line>
  <text x="32" y="135" class="mono label decrypt-temp" style="animation-delay:0.20s" fill="#8a1f1f" opacity="0">^\=_(%</text>
