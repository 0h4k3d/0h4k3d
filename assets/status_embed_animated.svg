  <text x="32" y="191" class="mono label decrypt-final" style="animation-delay:0.87s" fill="#6B6B6B" opacity="0">STATUS</text>
  <circle cx="184" cy="187" r="3.5" fill="#33FF6E" filter="url(#glowSoft)"></circle>
  <text x="196" y="191" class="mono body decrypt-temp" style="animation-delay:0.70s" fill="#8a1f1f" opacity="0">]&amp;%+0^ } 0{!]_&gt;!$ +1)*@*</text>
  <text x="196" y="191" class="mono body decrypt-temp" style="animation-delay:0.79s" fill="#8a1f1f" opacity="0">[##~&gt;# 0 }0%%/&gt;}^ ({]=&amp;}</text>
  <text x="196" y="191" class="mono body decrypt-temp" style="animation-delay:0.88s" fill="#8a1f1f" opacity="0">0~\&amp;\) - /|+&lt;{&lt;$* *#_![}</text>
  <text x="196" y="191" class="mono body decrypt-final" style="animation-delay:0.97s" fill="#E0A0A0" opacity="0">Online - Building Things</text>
  <line x1="32" y1="212" x2="688" y2="212" stroke="#2A0A0A" stroke-width="1"></line>

  
  <text x="32" y="236" class="mono footer handle-cycle handle-1" fill="#33FF6E">@0h4k3d</text>
  <text x="32" y="236" class="mono footer handle-cycle handle-2" fill="#FF5252">@realh4k3d</text>

  
  <g transform="translate(560,115)">
    <g transform="scale(0.85)" opacity="0.9">
      <path fill="#9A9A9A" d="M12 0C5.37 0 0 5.5 0 12.3c0 5.44 3.44 10.05 8.21 11.68.6.11.82-.27.82-.6v-2.1c-3.34.75-4.04-1.65-4.04-1.65-.55-1.42-1.34-1.8-1.34-1.8-1.1-.77.08-.76.08-.76 1.21.09 1.85 1.28 1.85 1.28 1.08 1.9 2.83 1.35 3.52 1.03.11-.8.42-1.35.77-1.66-2.67-.31-5.47-1.37-5.47-6.1 0-1.35.47-2.45 1.24-3.31-.12-.31-.54-1.57.12-3.27 0 0 1.01-.33 3.3 1.26.96-.27 1.98-.41 3-.41s2.04.14 3 .41c2.29-1.59 3.3-1.26 3.3-1.26.66 1.7.24 2.96.12 3.27.77.86 1.24 1.96 1.24 3.31 0 4.74-2.81 5.78-5.49 6.09.43.38.82 1.13.82 2.28v3.38c0 .33.22.72.83.6C20.57 22.35 24 17.74 24 12.3 24 5.5 18.63 0 12 0z"></path>
    </g>
    <text x="32" y="16" class="mono body decrypt-final" style="animation-delay:0.82s" fill="#33FF6E" opacity="0">@0h4k3d</text>
