  <text x="180" y="163" class="mono body decrypt-final" style="animation-delay:0.77s" fill="#FF5252" opacity="0">x.com/realh4k3d</text>
  <text x="32" y="191" class="mono label decrypt-temp" style="animation-delay:0.60s" fill="#8a1f1f" opacity="0">$)=^&lt;!</text>
  <text x="32" y="191" class="mono label decrypt-temp" style="animation-delay:0.69s" fill="#8a1f1f" opacity="0">~~({0^</text>
